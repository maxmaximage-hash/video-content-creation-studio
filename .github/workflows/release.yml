name: macOS Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:unit
      - run: npm run test:ui
      - run: npm run desktop:pack:arm64
      - run: npm run release:check -- "${GITHUB_REF_NAME}"
      - name: Verify and archive app
        run: |
          codesign --verify --deep --strict 'release/mac-arm64/Video Hub.app'
          ditto -c -k --sequesterRsrc --keepParent \
            'release/mac-arm64/Video Hub.app' \
            "release/Video-Hub-${GITHUB_REF_NAME}-mac-arm64.zip"
          shasum -a 256 "release/Video-Hub-${GITHUB_REF_NAME}-mac-arm64.zip" \
            > "release/Video-Hub-${GITHUB_REF_NAME}-SHA256.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/Video-Hub-${GITHUB_REF_NAME}-mac-arm64.zip" \
            "release/Video-Hub-${GITHUB_REF_NAME}-SHA256.txt" \
            --title "Video Hub ${GITHUB_REF_NAME}" \
            --generate-notes
