name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:unit
      - run: npm run test:ui
      - run: npm run build
      - run: npm run desktop:pack
